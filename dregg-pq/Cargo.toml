[package]
name = "dregg-pq"
version.workspace = true
edition.workspace = true

# The ONE shared post-quantum leaf. Consolidates the ML-DSA-65 (FIPS 204)
# from-seed derivation + sign/verify that had been copy-pasted into 9 crates,
# and the X25519+ML-KEM-768 hybrid session KEM that captp embedded inline.
#
# ml-kem 0.2.3 re-exports the Encapsulate/Decapsulate traits it is built on via
# its own `ml_kem::kem` module, so this crate depends ONLY on `ml-kem` and never
# names the pinned pre-release `kem = "=0.3.0-pre.0"` in its manifest. (That
# crate is still an UNAVOIDABLE transitive dep of ml-kem 0.2.3 itself — ml-kem's
# trait bounds are defined over it — but no first-party manifest pins it.)

[dependencies]
# ML-DSA-65 signatures (FIPS 204), deterministic keygen from a 32-byte seed.
fips204 = "0.4"
# ML-KEM-768 (FIPS 203) for the post-quantum half of the hybrid session KEM.
ml-kem = "0.2.3"
# X25519 classical half of the hybrid KEM.
x25519-dalek = { workspace = true }
# Concatenation-KDF combiner for the hybrid KEM.
hkdf = "0.12"
sha2 = { workspace = true }
zeroize = { workspace = true }
# OS entropy for the hybrid KEM RNG adapter.
getrandom = { workspace = true }
# The rand_core 0.6 CryptoRngCore that ml-kem / x25519-dalek consume.
rand_core = "0.6"

[features]
# ⚑ A DECLARED, BUILD-TIME acceptance of the unaudited `fips204`/`ml-kem` fallback, for a
# wasm32 TEST ORACLE ONLY. It is the wasm spelling of `DREGG_ALLOW_UNAUDITED_PQ=1`: wasm32 has
# no process environment, so the operator's opt-in cannot be expressed there at run time, and
# without one every ML-DSA keygen/sign in a wasm build reaches the refusal (`abort()`, which
# wasm renders as a message-less `RuntimeError: unreachable`). A compile_error forbids it on
# any non-wasm32 target, where the env var is the one channel. No shipped artifact enables it:
# the only enabler is `dregg-wasm`'s `unaudited-pq-test-oracle` feature, built by sdk-ts's
# `build:oracle` into `wasm/pkg-oracle` (never `wasm/pkg`, which the portal stages).
# `DREGG_REQUIRE_LEAN` still revokes it, exactly as it revokes the env opt-in.
wasm-unaudited-pq-test-oracle = []

[dev-dependencies]
# BRICK 8 gate (`tests/mldsa_lean_verify.rs`): install the leanc-native, Lean-verified REAL ML-DSA verify
# core so `ml_dsa_verify` is routed through it and the `fips204` crate leaves the verify TCB. A dev-dep
# ONLY — the shipping `dregg-pq` leaf never links the Lean archive; a deployed node installs the core.
dregg-lean-ffi = { path = "../dregg-lean-ffi" }

[lints]
workspace = true
